<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1F3A" />
  <meta name="description" content="FitVita — Đánh giá chỉ số cơ thể chuẩn Châu Á theo giới tính, lịch tập luyện cá nhân hóa và thực đơn dinh dưỡng 7 ngày." />
  <title>FitVita — Theo dõi Sức khỏe, Lịch tập &amp; Dinh dưỡng Cá nhân hóa</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="#overview" class="brand" data-nav="overview" aria-label="FitVita Trang chủ">
          <span class="brand-mark" aria-hidden="true">
            <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
              <defs>
                <linearGradient id="hdr-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#143A6B"/>
                  <stop offset="100%" stop-color="#07162B"/>
                </linearGradient>
                <linearGradient id="hdr-em" x1="16" y1="14" x2="50" y2="52" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#34D399"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
                <linearGradient id="hdr-rim" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#34D399"/>
                  <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.7"/>
                  <stop offset="100%" stop-color="#10B981"/>
                </linearGradient>
              </defs>
              <path d="M32 4L54 12.2C55.8 12.9 57 14.6 57 16.5V31.5C57 45.4 46.8 55.6 33.4 59.6C32.5 59.9 31.5 59.9 30.6 59.6C17.2 55.6 7 45.4 7 31.5V16.5C7 14.6 8.2 12.9 10 12.2L32 4Z" fill="url(#hdr-bg)" stroke="url(#hdr-rim)" stroke-width="2.5"/>
              <path d="M18.5 22.5L29.6 45.2C30.6 47.2 33.4 47.2 34.4 45.2L45.5 22.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 32.5H23.5L27.4 25.5L32.2 38.5L36.2 29.5H48" stroke="url(#hdr-em)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="32" cy="17.5" r="3" fill="#34D399"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>Fit<span class="brand-accent">Vita</span></strong>
            <small>Sức khỏe • Tập luyện • Dinh dưỡng</small>
          </span>
        </a>

        <nav class="desktop-nav" role="tablist" aria-label="Điều hướng chính">
          <button type="button" class="nav-tab" role="tab" data-tab="overview" aria-selected="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 7v5l3 3"/></svg>
            <span>Tổng quan &amp; Chỉ số</span>
          </button>
          <button type="button" class="nav-tab" role="tab" data-tab="workout" aria-selected="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M12 6.5v11"/></svg>
            <span>Lịch tập</span>
          </button>
          <button type="button" class="nav-tab" role="tab" data-tab="nutrition" aria-selected="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
            <span>Thực đơn</span>
          </button>
          <button type="button" class="nav-tab" role="tab" data-tab="history" aria-selected="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>
            <span>Lịch sử tập</span>
          </button>
        </nav>

        <div class="topbar-actions">
          <button type="button" id="theme-toggle" class="icon-btn" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện Sáng / Tối">
            <span id="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <section id="panel-overview" class="tab-panel" role="tabpanel" aria-label="Tổng quan và chỉ số cơ thể"></section>
        <section id="panel-workout" class="tab-panel" role="tabpanel" aria-label="Lịch tập luyện" hidden></section>
        <section id="panel-nutrition" class="tab-panel" role="tabpanel" aria-label="Thực đơn dinh dưỡng" hidden></section>
        <section id="panel-history" class="tab-panel" role="tabpanel" aria-label="Lịch sử tập luyện" hidden></section>
      </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav" role="tablist" aria-label="Điều hướng di động">
      <button type="button" class="mobile-nav-btn" role="tab" data-tab="overview" aria-selected="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 7v5l3 3"/></svg>
        <span>Chỉ số</span>
      </button>
      <button type="button" class="mobile-nav-btn" role="tab" data-tab="workout" aria-selected="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M12 6.5v11"/></svg>
        <span>Lịch tập</span>
      </button>
      <button type="button" class="mobile-nav-btn" role="tab" data-tab="nutrition" aria-selected="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        <span>Thực đơn</span>
      </button>
      <button type="button" class="mobile-nav-btn" role="tab" data-tab="history" aria-selected="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 2"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>
        <span>Lịch sử</span>
      </button>
    </nav>
  </div>

  <!-- Quick 5-Hour Simulation Button (corner pill; docked into topbar on mobile so it never covers content) -->
  <button type="button" id="sim-5h-btn" class="sim-fab" title="Kiểm thử nhanh quy tắc tự động chốt buổi tập sau 5 tiếng">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    <span class="sim-label-full">Mô phỏng qua 5 tiếng</span>
    <span class="sim-label-short">Qua 5h</span>
  </button>

  <!-- Exercise Guide Modal -->
  <div id="guide-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="guide-modal-title" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <span class="badge badge-accent" id="guide-modal-muscle">Nhóm cơ</span>
          <h2 id="guide-modal-title" class="modal-title">Hướng dẫn bài tập</h2>
        </div>
        <button type="button" class="icon-btn modal-close" data-close-modal="guide-modal" aria-label="Đóng hướng dẫn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="guide-modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-close-modal="guide-modal">Đã hiểu, tiếp tục tập</button>
      </div>
    </div>
  </div>

  <!-- Missed Workout Auto-Close Alert Modal -->
  <div id="missed-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="missed-modal-title" hidden>
    <div class="modal-card modal-alert">
      <div class="modal-header">
        <div>
          <span class="badge badge-warning">Tự động chốt sau 5 tiếng</span>
          <h2 id="missed-modal-title" class="modal-title">Buổi tập trước đã được chốt tự động</h2>
        </div>
        <button type="button" class="icon-btn modal-close" data-close-modal="missed-modal" aria-label="Đóng thông báo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="missed-modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close-modal="missed-modal">Để sau</button>
        <button type="button" class="btn btn-primary" id="open-next-session-btn">Mở buổi tập tiếp theo</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="data.js?v=2"></script>
  <script src="engine.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
